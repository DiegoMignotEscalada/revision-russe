<!DOCTYPE html>

<head>

<title>Révision de russe</title>
<meta name="theme-color" content="#0e0e12">
<!-- Politique de sécurité du contenu. GitHub Pages n'envoie aucun en-tête HTTP
     configurable : elle est donc déclarée ici.
     Depuis la version 2, elle n'autorise PLUS RIEN hors de ce site : ni
     script, ni style, ni police, ni image, ni connexion vers un tiers. Les
     polices, auparavant chargées chez Google, sont dans le dossier polices/.
     Les styles sont dans style.css : aucun style écrit dans le HTML n'est
     accepté, ce qui ferme la dernière dérogation de la version 1. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  script-src 'self';
  style-src 'self';
  font-src 'self';
  img-src 'self' data:;
  connect-src 'self';
  manifest-src 'self';
  worker-src 'self';
  object-src 'none';
  frame-src 'none';
  base-uri 'none';
  form-action 'none'">
<!-- Aucune adresse de provenance n'est transmise si un lien sortant est suivi. -->
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icones/icone-192.png">
<link rel="apple-touch-icon" href="./icones/icone-192.png">
<link rel="stylesheet" href="./style.css">
</head>
